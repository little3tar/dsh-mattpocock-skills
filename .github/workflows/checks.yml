# The pack is generated from upstream, so the invariants are cheap to check and
# worth checking on every push: a hand edit to skills/ would be silently reverted
# by the next sync, and a rule upstream rewording has invalidated stops firing.
name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Release hygiene, and the only check that is inert on a branch push.
      - name: release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "v$package_version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json v$package_version"
            exit 1
          fi
      # No install step: the package has no dependencies.
      - name: adaptation rules
        run: npm test
      - name: frontmatter + adaptation leftovers
        run: node scripts/verify-skills.mjs
      # Fetches the pinned commit from mattpocock/skills and re-derives the pack.
      - name: pack is reproducible from its pin
        run: node scripts/sync-upstream.mjs --check
